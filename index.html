<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma de Treinamento e Integração</title>
<link rel="icon" id="favicon" href="data:,">
<script>try{var t=localStorage.getItem("treinamentos-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#14302A; --muted:#5B6D68;
  --line:#D6DFDB; --accent:#0E6B57; --accent-soft:#DDEFE9; --on-accent:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#DFF1E5; --warn:#A8521A; --warn-soft:#F8E6D9; --bad:#A83232; --bad-soft:#F6DEDE;
  --radius-lg:14px; --radius:9px; --radius-sm:6px;
  --font:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1715; --surface:#14211E; --sunk:#101B19; --ink:#E2EBE8; --muted:#94A6A1;
    --line:#263733; --accent:#4DBB9C; --accent-soft:#18332C; --on-accent:#08201A;
    --ok:#6CC48F; --ok-soft:#173022; --warn:#E39B62; --warn-soft:#33241A; --bad:#E07B7B; --bad-soft:#341C1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#14211E; --sunk:#101B19; --ink:#E2EBE8; --muted:#94A6A1;
  --line:#263733; --accent:#4DBB9C; --accent-soft:#18332C; --on-accent:#08201A;
  --ok:#6CC48F; --ok-soft:#173022; --warn:#E39B62; --warn-soft:#33241A; --bad:#E07B7B; --bad-soft:#341C1C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img,video{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:2px 8px 22px}
.brand-mark{width:48px;height:48px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:12px 8px}
.nav .foot{font-size:12px;color:var(--muted);padding:0}
.nav button[hidden],.nav .sep[hidden]{display:none}
.app[hidden]{display:none}
.brand-mark{overflow:hidden}
.brand-mark.has-logo{background:transparent;border-radius:0;width:100%;max-width:200px;height:68px}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.nav .brand-mark.has-logo img{object-position:left center}
:root[data-theme="dark"] .brand-mark.has-logo img{filter:invert(1) hue-rotate(180deg) brightness(1.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-mark.has-logo img{filter:invert(1) hue-rotate(180deg) brightness(1.05)}}
.brand-mark svg{width:24px;height:24px}
.brand>div:last-child{min-width:0}
.brand b,.brand span{overflow-wrap:anywhere}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}
.who-id{min-width:0}
.who-id .name{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-id .badge{margin-top:4px}
.col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;align-items:flex-start;padding:14px clamp(16px,2.4vw,28px) 0;pointer-events:none;height:0;overflow:visible}
.topbar .tools{pointer-events:auto;display:flex;gap:2px;padding:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.topbar .icon-btn{border-radius:999px;width:38px;height:38px}
.topbar .icon-btn:hover{background:var(--sunk);color:var(--ink,inherit)}
.icon-btn,.nav .icon-btn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;border-radius:var(--radius);color:var(--muted);flex:none}
.icon-btn:hover,.nav .icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.icon-btn[hidden]{display:none}
.icon-btn svg{width:18px;height:18px}

/* Acesso */
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.auth[hidden]{display:none}
.auth-tools{display:flex;justify-content:flex-end;gap:6px;padding:14px 0}
.auth-tools .icon-btn{border:1px solid var(--line);background:var(--surface)}
.auth-mid{flex:1;display:grid;place-items:center;padding:8px 0 24px}
.auth-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:4px}
.auth-brand .brand-mark{width:72px;height:72px;border-radius:16px}
.auth-brand .brand-mark svg{width:36px;height:36px}
.auth-brand .brand-mark.has-logo{width:240px;max-width:100%;height:104px}
.auth-brand h1{font-size:22px}
.auth-card .btn.primary{justify-content:center;padding:10px 14px}
.auth-err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius);padding:9px 12px;font-size:13.5px}
.rights{font-size:12.5px;color:var(--muted);text-align:center;padding:16px 0}
main .rights{text-align:left;margin-top:48px;padding:16px 0 0;border-top:1px solid var(--line)}
.matrix{min-width:560px}
.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:center;width:120px}
.matrix input{accent-color:var(--accent);width:18px;height:18px;cursor:pointer}
.matrix input:disabled{cursor:not-allowed;opacity:.6}
.matrix tr.grp td{background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 14px}
.logo-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo-prev{width:104px;height:104px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.logo-prev svg{width:44px;height:44px;color:var(--muted)}

main{padding:72px clamp(16px,4vw,48px) 64px;min-width:0;max-width:1180px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
h3{font-size:16px;margin:0;font-weight:600}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px}
.stat strong{display:block;font-size:30px;line-height:1.1;font-weight:700}
.stat span{color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 8px;border-radius:var(--radius-sm);background:var(--sunk);color:var(--muted)}
.badge svg{width:13px;height:13px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab .n{font-size:12px;opacity:.7}

.area-block{margin-bottom:28px}
.area-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.area-title .dot{width:12px;height:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.tcard p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.tcard .actions{display:flex;gap:4px;margin-top:auto;padding-top:4px;border-top:1px solid var(--line)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:none}
td .prog{display:flex;align-items:center;gap:10px;min-width:150px}
td .prog .bar{flex:1}

.empty{border:1px dashed var(--line);border-radius:var(--radius-lg);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}

.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1;min-width:0}

/* Forms & dialog */
dialog{border:none;border-radius:var(--radius-lg);padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(10,30,25,.28)}
dialog::backdrop{background:rgba(8,20,17,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13.5px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:var(--radius);padding:9px 11px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
fieldset.field legend{padding:0;margin-bottom:6px;font-size:13.5px;font-weight:500}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--sunk);cursor:pointer;font-size:14px;line-height:1.2}
.pick label:hover{border-color:var(--accent)}
.pick input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.pick label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.pick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pick-off{opacity:.45}
.pick-off .pick label{cursor:not-allowed}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.switch{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--sunk);cursor:pointer}
.switch input{appearance:none;width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(17px)}
.switch b{display:block;font-weight:600}

.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;background:var(--sunk);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.drop svg{width:28px;height:28px;color:var(--accent)}

.q{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.q-head{display:flex;gap:8px;align-items:center}
.q-head .num{font-weight:700;color:var(--muted);font-size:13px;min-width:22px}
.opt{display:flex;align-items:center;gap:8px}
.opt input[type=radio]{accent-color:var(--accent);width:18px;height:18px;flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

/* Study */
.track{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--accent)}
.step .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:var(--muted)}
.step.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.step.part .st{border-color:var(--warn);color:var(--warn)}
.step .st svg{width:16px;height:16px}
.player{background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.player video{width:100%;height:100%;display:block}
.pbox{background:#000;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.pbox .player{border-radius:0;position:relative}
.pbox video{cursor:pointer}
.pbox:fullscreen{border-radius:0;width:100vw;height:100vh}
.pbox:fullscreen .player{flex:1;aspect-ratio:auto;min-height:0}
.pctl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0E1A17;color:#E6EFEC}
.pctl button{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:6px;flex:none}
.pctl button:hover{background:rgba(255,255,255,.1)}
.pctl button:focus-visible{outline:2px solid #4DBB9C}
.pctl svg{width:18px;height:18px}
.pctl .rst{display:inline-flex;gap:6px;padding:0 10px;font-size:13px}
.ptime{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#B9C8C4}
.ptrack{flex:1;height:8px;background:rgba(255,255,255,.16);border-radius:99px;position:relative;min-width:60px}
.ptrack .seen{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.32);border-radius:99px;cursor:pointer}
.ptrack .cur{position:absolute;left:0;top:0;bottom:0;background:#4DBB9C;border-radius:99px;pointer-events:none}
.resume{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);padding:16px}
.resume[hidden]{display:none}
.resume>div{background:var(--surface);color:var(--ink);border-radius:var(--radius-lg);padding:18px 20px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px}
.resume .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media (max-width:520px){.pctl .rst span{display:none}.ptime{font-size:11.5px}}
.player .novideo{color:#9fb1ac;padding:20px;text-align:center}
.quiz .qq{padding:16px 0;border-bottom:1px solid var(--line)}
.quiz .qq:last-of-type{border-bottom:none}
.quiz label.choice{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);margin-top:8px;cursor:pointer}
.quiz label.choice:hover{background:var(--sunk)}
.quiz label.choice input{accent-color:var(--accent);width:18px;height:18px}
.quiz label.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz label.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.result{border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center}
.result.ok{background:var(--ok-soft)}
.result.bad{background:var(--bad-soft)}
.result strong{font-size:28px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--radius);opacity:0;pointer-events:none;transition:all .2s;z-index:50;font-size:14px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}

/* Certificados */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.filters .field{min-width:180px;flex:1}
.filters .field.grow2{flex:2;min-width:220px}
.cert-check{accent-color:var(--accent);width:18px;height:18px;cursor:pointer}
.code{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:13px}
#certDlg{width:min(1000px,calc(100vw - 24px))}
.cert-prev{display:flex;flex-direction:column;gap:14px;background:var(--sunk);padding:14px;border-radius:var(--radius)}
.cert-prev .cert-page{box-shadow:0 2px 14px rgba(10,30,25,.18)}
.cert-page{container-type:inline-size;width:100%;aspect-ratio:297/210;background:#fff;color:#1B2A26;position:relative;overflow:hidden;font-family:var(--font)}
.cert{position:absolute;inset:0;padding:2.1cqw}
.cert-frame{position:relative;height:100%;border:.22cqw solid #0E6B57;padding:3.2cqw 6cqw 2cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert-frame::before{content:"";position:absolute;inset:.7cqw;border:.07cqw solid #9CC9BB;pointer-events:none}
.cert-band{position:absolute;left:0;right:0;top:0;height:.9cqw;background:#0E6B57}
.cert-top{display:flex;align-items:center;gap:1.4cqw;margin-bottom:2.4cqw}
.cert-logo{width:6.2cqw;height:6.2cqw;display:grid;place-items:center;border-radius:1cqw;overflow:hidden}
.cert-logo img{width:100%;height:100%;object-fit:contain}
.cert-logo:not(.def){width:auto;max-width:26cqw;height:7.5cqw;border-radius:0}
.cert-logo:not(.def) img{width:auto;max-width:26cqw}
.cert-logo.def{background:#0E6B57;color:#fff}
.cert-logo.def svg{width:3.2cqw;height:3.2cqw}
.cert-org{font-size:1.55cqw;font-weight:600;text-align:left;line-height:1.25;max-width:40cqw}
.cert-title{font-size:5.6cqw;font-weight:700;letter-spacing:.02em;color:#0E6B57;line-height:1}
.cert-sub{font-size:1.6cqw;color:#5B6D68;margin-top:.8cqw}
.cert-lead{font-size:1.55cqw;margin:2.6cqw 0 .6cqw;color:#5B6D68}
.cert-name{font-family:Georgia,"Times New Roman",serif;font-size:4.1cqw;line-height:1.15;border-bottom:.08cqw solid #B9C8C4;padding:0 3cqw .9cqw;max-width:100%}
.cert-text{font-size:1.65cqw;line-height:1.6;margin:1.8cqw 0 0;max-width:70cqw}
.cert-text b{color:#0E6B57}
.cert-place{font-size:1.4cqw;color:#5B6D68;margin:1.6cqw 0 0}
.cert-signs{display:flex;justify-content:center;gap:8cqw;margin-top:auto;width:100%}
.cert-sign{width:24cqw;border-top:.09cqw solid #1B2A26;padding-top:.7cqw;font-size:1.3cqw;line-height:1.35}
.cert-sign span{display:block;color:#5B6D68;font-size:1.15cqw}
.cert-frame.verso{align-items:stretch;text-align:left;padding:3.4cqw 6cqw 2cqw}
.verso-head{border-bottom:.08cqw solid #B9C8C4;padding-bottom:1.4cqw;margin-bottom:1.8cqw}
.verso-title{font-size:3.1cqw;font-weight:700;color:#0E6B57;line-height:1.1}
.verso-sub{font-size:1.5cqw;margin-top:.7cqw}
.verso-sub span{color:#5B6D68}
.verso-list{list-style:none;margin:0;padding:0;font-size:var(--fs,1.5cqw);line-height:1.45;flex:1;min-height:0;overflow:hidden}
.verso-list.cols{columns:2;column-gap:4cqw}
.verso-list li,.verso-group li{position:relative;padding-left:1.6cqw;margin-bottom:.55em;break-inside:avoid}
.verso-list li::before,.verso-group li::before{content:"";position:absolute;left:0;top:.5em;width:.6cqw;height:.6cqw;border-radius:50%;background:#0E6B57}
.cert-opts{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.cert-opts input{accent-color:var(--accent);width:18px;height:18px}
.cert-foot{display:flex;justify-content:space-between;gap:2cqw;width:100%;font-size:1cqw;color:#7A8B86;margin-top:2cqw}
.cert-frame.combo{padding-top:2.6cqw}
.combo .cert-top{margin-bottom:1.4cqw}
.combo .cert-title{font-size:4.4cqw}
.combo .cert-lead{margin-top:1.6cqw}
.combo .cert-name{font-size:3.4cqw}
.combo .cert-text{margin-top:1.2cqw}
.combo .cert-place{margin-top:1cqw}
.cert-list{width:78cqw;border-collapse:collapse;margin-top:1.4cqw;font-size:var(--fs,1.3cqw);line-height:1.3;text-align:left}
.cert-list th{font-weight:600;color:#5B6D68;font-size:.85em;border-bottom:.08cqw solid #B9C8C4;padding:.4cqw .8cqw;background:none}
.cert-list td{padding:.45cqw .8cqw;border-bottom:.06cqw solid #E2EBE8;vertical-align:top}
.cert-list td:first-child{font-weight:600;color:#0E6B57}
.cert-list .num{white-space:nowrap;text-align:right}
.cert-list .cd{white-space:nowrap;color:#5B6D68;font-size:.85em}
.verso-group{break-inside:avoid;margin-bottom:.9em}
.verso-group h4{margin:0 0 .45em;font-size:1.08em;color:#0E6B57;line-height:1.25}
.verso-group h4 span{font-weight:400;color:#5B6D68;font-size:.9em}
.verso-group ul{list-style:none;margin:0;padding:0}
@media print{
  @page{size:A4 landscape;margin:0}
  :root{padding:0!important}
  html,body{background:#fff!important;margin:0!important;height:auto!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .cert-page{width:297mm;height:210mm;aspect-ratio:auto;break-after:page;page-break-after:always}
  #printArea .cert-page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printArea{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;align-content:start}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-right:none;border-bottom:1px solid var(--line);z-index:10;gap:2px}
  .nav .sep,.nav .foot{display:none}
  .brand{flex:none;flex-direction:row;align-items:center;padding:0 8px 0 0}
  .brand>div:last-child{display:none}
  .brand-mark{width:34px;height:34px;border-radius:9px}
  .brand-mark.has-logo{width:96px;height:34px}
  .who{flex-direction:row;align-items:center;margin:0 0 0 auto;border-top:none;border-left:1px solid var(--line);padding:0 0 0 6px}
  .who-id{display:none}
  .who{display:none}
  .topbar{position:static;height:auto;padding:10px 16px 0}
  main{padding-top:12px!important}
  .nav button{white-space:nowrap;padding:8px 10px;font-size:14px}
  .grid2,.row2{grid-template-columns:1fr}
  main{padding-top:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(() => {
"use strict";

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const parseDay = (s) => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (m) return new Date(+m[1], +m[2] - 1, +m[3]); const d = new Date(s); if (isNaN(d)) return null; d.setHours(0, 0, 0, 0); return d; };
const fmtDate = (iso) => { const d = parseDay(iso); return d ? d.toLocaleDateString("pt-BR") : "—"; };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtTime = (sec) => { sec = Math.max(0, Math.floor(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s2 = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0"); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const maxVideo = () => caps.mode === "local" ? 1024 * 1024 * 1024 : 20 * 1024 * 1024;
const COLORS = ["#0E6B57","#2F64B5","#B5532F","#8A3FA8","#C28A12","#3A8A99","#B03A63","#5A7A2B"];
const ICON = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5Z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  restart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  award:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="m8.5 13.8-1.5 7.2 5-3 5 3-1.5-7.2"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6Z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
  fsExit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>'
};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}
function askConfirm(title, text, okLabel = "Excluir") {
  return new Promise(res => {
    const d = $("#confirm");
    d.innerHTML = `<div class="dlg-body"><h3>${esc(title)}</h3><p class="muted" style="margin:0">${esc(text)}</p></div>
      <div class="dlg-foot"><button class="btn" data-a="no">Cancelar</button><button class="btn primary" data-a="yes">${esc(okLabel)}</button></div>`;
    d.onclick = (e) => { const a = e.target.closest("[data-a]")?.dataset.a; if (a) { d.close(); res(a === "yes"); } };
    d.oncancel = () => res(false);
    d.showModal();
  });
}

/* ---------- armazenamento ---------- */
const COLS = ["areas", "trainings", "employees", "progress", "users", "config"];
const DATA_COLS = ["areas", "trainings", "employees", "progress"];
const state = { areas: [], trainings: [], employees: [], progress: [], users: [], config: [] };
const caps = { db: null, assets: null, user: null, canWrite: true, mode: "loading" };
const LOCAL_KEY = "treinamentos-local-v1";
const VideoDB = {
  open() { return this._p ||= new Promise((res, rej) => { const r = indexedDB.open("treinamentos-videos", 1); r.onupgradeneeded = () => r.result.createObjectStore("videos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("videos", mode); const req = fn(t.objectStore("videos")); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(id, blob) { return this.tx("readwrite", s => s.put(blob, id)); },
  get(id) { return this.tx("readonly", s => s.get(id)); },
  del(id) { return this.tx("readwrite", s => s.delete(id)); }
};
let currentVideoUrl = null;

const Store = {
  async init() {
    const use = (n) => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    const [db, user, assets] = await Promise.all([use("db"), use("user"), use("assets")]);
    caps.db = db; caps.user = user; caps.assets = assets;
    if (user && typeof user.can === "function") {
      try { const c = await user.can("data.write"); if (c === false) caps.canWrite = false; } catch {}
    }
    if (db) {
      caps.mode = "shared";
      let first = 0;
      COLS.forEach(col => {
        db.collection(col).onSnapshot(snap => {
          state[col] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (first < COLS.length) first++;
          if (first >= COLS.length) render();
        }, err => { console.warn(col, err); if (err.code === "revoked") { caps.canWrite = false; render(); } });
      });
      $("#syncState").textContent = "Dados compartilhados com sua equipe";
    } else {
      caps.mode = "local";
      try { Object.assign(state, JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")); } catch {}
      COLS.forEach(c => { if (!Array.isArray(state[c])) state[c] = []; });
      $("#syncState").textContent = "Dados salvos neste navegador";
      render();
    }
  },
  persistLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch {} },
  async save(col, id, data, opts = {}) {
    if (caps.mode === "shared") {
      try { await caps.db.collection(col).doc(id).set(data); }
      catch (e) {
        if (e.code === "invalid_argument") { caps.canWrite = false; render(); throw new Error("Seu acesso permite apenas visualizar."); }
        if (e.code === "quota_exceeded") throw new Error("O limite de armazenamento foi atingido.");
        throw new Error("Não foi possível salvar. Tente novamente.");
      }
    } else {
      const arr = state[col]; const i = arr.findIndex(x => x.id === id);
      const doc = { id, ...data }; if (i >= 0) arr[i] = doc; else arr.push(doc);
      this.persistLocal(); if (!opts.silent) render();

function readLogo(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error("Escolha um arquivo de imagem (PNG, JPG, SVG ou WebP)."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Não foi possível ler a imagem."));
    fr.onload = () => {
      const url = fr.result;

      const img = new Image();

      img.onload = () => {
        const max = 256, k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));

        let out = cv.toDataURL("image/png");
        if (out.length > 180000) out = cv.toDataURL("image/webp", 0.9);

      img.src = url;

}

  const v = $("#view");
  const notice = !caps.canWrite ? `<div class="notice">Seu acesso permite apenas visualizar. Peça ao responsável para liberar edição.</div>` : "";
  const fn = { painel: viewPainel, treinamentos: viewTreinamentos, funcionarios: viewFuncionarios, areas: viewAreas, estudar: viewEstudar, certificados: viewCertificados, acessos: viewAcessos, config: viewConfig }[route] || viewSemAcesso;
  const oldWrap = $("#playerWrap");
  v.innerHTML = notice + fn() + `<footer class="rights" data-rights>${esc(rightsText())}</footer>`;
  const slot = $("#playerWrap");
  if (oldWrap && slot && oldWrap.dataset.key === slot.dataset.key) slot.replaceWith(oldWrap);
  else if (oldWrap) closePlayer(oldWrap);
  bindView();
}

/* ---------- Painel ---------- */
function viewPainel() {
  const emps = state.employees, trs = state.trainings;
  let reqTotal = 0, reqDone = 0;
  emps.forEach(e => { const s = empStats(e); reqTotal += s.total; reqDone += s.done; });
  const withTest = trs.filter(t => t.temTeste).length;
  const attempts = state.progress.filter(p => p.tentativas);
  const avg = attempts.length ? Math.round(attempts.reduce((s, p) => s + (p.nota || 0), 0) / attempts.length) : null;

  const areaRows = sortedAreas().map(a => {
    const ae = emps.filter(e => e.areaId === a.id);
    let t = 0, d = 0; ae.forEach(e => { const s = empStats(e); t += s.total; d += s.done; });
    const nt = trs.filter(x => trInArea(x, a.id)).length;
    return `<div class="list-row"><div class="grow"><div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:${esc(a.cor)}"></span><b>${esc(a.nome)}</b></div>
      <div class="small muted">${nt} treinamento${nt === 1 ? "" : "s"} · ${ae.length} funcionário${ae.length === 1 ? "" : "s"}</div></div>
      <div style="width:42%;display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1"><i style="width:${pct(d, t)}%;background:${esc(a.cor)}"></i></div><span class="small" style="min-width:36px;text-align:right">${pct(d, t)}%</span></div></div>`;
  }).join("");

  const prazos = [];
  emps.forEach(e => required(e).forEach(t => { const i = prazoInfo(e, t, progOf(e.id, t.id)); if (i && !i.done && i.left <= 7) prazos.push({ e, t, i }); }));
  prazos.sort((a, b) => a.i.left - b.i.left);
  const atrasados = prazos.filter(x => x.i.overdue).length;
  const integ = trs.filter(t => t.todasAreas);
  const pendInteg = emps.map(e => ({ e, pend: integ.filter(t => !isDone(progOf(e.id, t.id), t)).length })).filter(x => x.pend > 0)
    .sort((a, b) => (b.e.admissao || "").localeCompare(a.e.admissao || "")).slice(0, 8);

  return `<div class="head"><div><h1>Painel</h1><p>Acompanhe o andamento dos treinamentos e da integração de novos funcionários.</p></div>
    ${caps.mode === "local" && can("backup") ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Exportar backup</button><label class="btn" style="cursor:pointer">Importar backup<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>` : ""}</div>
  <div class="stats">
    <div class="stat"><strong>${emps.length}</strong><span>Funcionários cadastrados</span></div>
    <div class="stat"><strong>${trs.length}</strong><span>Treinamentos · ${withTest} com teste</span></div>
    <div class="stat"><strong>${pct(reqDone, reqTotal)}%</strong><span>Dos treinamentos obrigatórios concluídos</span></div>
    <div class="stat"><strong>${avg == null ? "—" : avg + "%"}</strong><span>Nota média nos testes</span></div>
    <div class="stat"><strong style="${atrasados ? "color:var(--bad)" : ""}">${atrasados}</strong><span>Treinamentos com prazo vencido</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h2>Conclusão por área</h2>${areaRows ? `<div class="list">${areaRows}</div>` : `<p class="muted">Cadastre áreas para ver o andamento de cada uma.</p>`}</section>
    <section class="panel"><h2>Integração pendente</h2>
      ${!integ.length ? `<p class="muted">Nenhum treinamento de integração ainda. Ao cadastrar um treinamento, marque “Obrigatório para todas as áreas” para ele entrar aqui.</p>`
        : pendInteg.length ? `<div class="list">${pendInteg.map(({ e, pend }) => `<div class="list-row"><div class="grow"><b>${esc(e.nome)}</b><div class="small muted">${esc(areaById(e.areaId)?.nome || "Sem área")} · admissão ${fmtDate(e.admissao)}</div></div><span class="badge warn">${pend} pendente${pend > 1 ? "s" : ""}</span></div>`).join("")}</div>`
        : `<p class="muted">Todos os funcionários concluíram a integração.</p>`}
    </section>
  </div>
  <section class="panel" style="margin-top:16px"><h2>Prazos vencidos e próximos 7 dias</h2>
    ${prazos.length ? `<div class="list">${prazos.slice(0, 12).map(({ e, t, i }) => `<div class="list-row"><div class="grow"><b>${esc(e.nome)}</b><div class="small muted">${esc(t.titulo)}</div></div>${prazoBadge(i)}</div>`).join("")}</div>${prazos.length > 12 ? `<p class="small muted" style="margin:10px 0 0">E mais ${prazos.length - 12}.</p>` : ""}`
      : `<p class="muted" style="margin:0">Nenhum treinamento vencido ou vencendo nos próximos 7 dias.</p>`}
  </section>`;
}

/* ---------- Treinamentos ---------- */
function trainingCard(t) {
  const al = trAreaList(t), a = al[0];
  const concl = state.employees.filter(e => trFor(t, e) && isDone(progOf(e.id, t.id), t)).length;
  const alvo = state.employees.filter(e => trFor(t, e)).length;
  const atr = state.employees.filter(e => trFor(t, e) && prazoInfo(e, t, progOf(e.id, t.id))?.overdue).length;
  const gr = (t.grupoCipa ? `<span class="badge acc">Grupo CIPA</span>` : "") + (t.grupoBrigada ? `<span class="badge warn">Grupo Brigada</span>` : "");
  return `<article class="tcard" style="--c:${esc(t.todasAreas ? "var(--accent)" : (a?.cor || (gr ? "var(--accent)" : "var(--line)")))}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(t.titulo)}</h3>${t.duracao ? `<span class="small muted" style="white-space:nowrap">${esc(t.duracao)} min</span>` : ""}</div>
    ${t.descricao ? `<p>${esc(t.descricao)}</p>` : ""}
    <div class="meta">
      ${t.todasAreas ? `<span class="badge acc">Integração · todas as áreas</span>` : (al.length ? al.map(areaChip).join("") : gr ? "" : areaChip(null)) + gr}
      ${t.videoId ? `<span class="badge">Vídeo</span>` : `<span class="badge">Sem vídeo</span>`}
      ${t.temTeste ? `<span class="badge warn">Teste · ${(t.perguntas || []).length} perguntas · mín. ${esc(t.notaMinima)}%</span>` : `<span class="badge">Sem teste</span>`}
      ${prazoTexto(t) ? `<span class="badge acc">${esc(prazoTexto(t))}</span>` : ""}
      ${t.certificado !== false ? `<span class="badge">Certificado${t.conteudo ? " com verso" : ""}</span>` : ""}
    </div>
    <div class="small muted">${concl} de ${alvo} concluíram${atr ? ` · <span style="color:var(--bad)">${atr} atrasado${atr > 1 ? "s" : ""}</span>` : ""}</div>
    ${canEd("treinamentos") ? `<div class="actions"><button class="btn ghost" data-act="edit-tr" data-id="${esc(t.id)}">${ICON.edit}Editar</button><button class="btn ghost danger" data-act="del-tr" data-id="${esc(t.id)}">${ICON.trash}Excluir</button></div>` : ""}
  </article>`;
}
function viewTreinamentos() {
  const trs = [...state.trainings].sort((a, b) => (a.titulo || "").localeCompare(b.titulo || "", "pt-BR"));
  const areas = sortedAreas();
  const count = (fn) => trs.filter(fn).length;
  const isCipa = (t) => !t.todasAreas && !!t.grupoCipa, isBrig = (t) => !t.todasAreas && !!t.grupoBrigada;
  if ((ui.areaFilter === "__cipa" && !count(isCipa)) || (ui.areaFilter === "__brig" && !count(isBrig))) ui.areaFilter = "all";
  const tabs = [`<button class="tab" data-filter="all" aria-pressed="${ui.areaFilter === "all"}">Todas <span class="n">${trs.length}</span></button>`,
    `<button class="tab" data-filter="__integ" aria-pressed="${ui.areaFilter === "__integ"}">Integração <span class="n">${count(t => t.todasAreas)}</span></button>`,
    ...(count(isCipa) ? [`<button class="tab" data-filter="__cipa" aria-pressed="${ui.areaFilter === "__cipa"}">Grupo CIPA <span class="n">${count(isCipa)}</span></button>`] : []),
    ...(count(isBrig) ? [`<button class="tab" data-filter="__brig" aria-pressed="${ui.areaFilter === "__brig"}">Grupo Brigada <span class="n">${count(isBrig)}</span></button>`] : []),
    ...areas.map(a => `<button class="tab" data-filter="${esc(a.id)}" aria-pressed="${ui.areaFilter === a.id}"><span class="dot" style="background:${esc(a.cor)}"></span>${esc(a.nome)} <span class="n">${count(t => trInArea(t, a.id))}</span></button>`)].join("");

  let body = "";
  const block = (title, color, list) => list.length ? `<section class="area-block"><div class="area-title">${color ? `<span class="dot" style="background:${esc(color)}"></span>` : ""}<h2 style="margin:0">${esc(title)}</h2></div><div class="cards">${list.map(trainingCard).join("")}</div></section>` : "";
  if (!trs.length) {
    body = `<div class="empty"><h3>Nenhum treinamento cadastrado</h3><p>Cadastre o primeiro treinamento, envie o vídeo e decida se ele terá teste de conhecimento.</p>${canEd("treinamentos") ? `<button class="btn primary" data-act="new-tr">${ICON.plus}Cadastrar treinamento</button>` : ""}</div>`;
  } else if (ui.areaFilter === "all") {
    body = block("Integração · todas as áreas", null, trs.filter(t => t.todasAreas))
      + block("Grupo CIPA", null, trs.filter(isCipa)) + block("Grupo Brigada de incêndio", null, trs.filter(isBrig))
      + areas.map(a => block(a.nome, a.cor, trs.filter(t => trInArea(t, a.id)))).join("")
      + block("Sem área", null, trs.filter(t => !t.todasAreas && !trAreaList(t).length && !trGrupos(t).length));
  } else {
    const list = ui.areaFilter === "__integ" ? trs.filter(t => t.todasAreas) : ui.areaFilter === "__cipa" ? trs.filter(isCipa) : ui.areaFilter === "__brig" ? trs.filter(isBrig) : trs.filter(t => trInArea(t, ui.areaFilter));
    body = list.length ? `<div class="cards">${list.map(trainingCard).join("")}</div>` : `<div class="empty"><h3>Nenhum treinamento nesta área</h3>${canEd("treinamentos") ? `<button class="btn primary" data-act="new-tr">${ICON.plus}Cadastrar treinamento</button>` : ""}</div>`;
  }
  return `<div class="head"><div><h1>Treinamentos</h1><p>Organizados por área. Os de integração valem para todos os funcionários; os de CIPA e Brigada, para os membros de cada grupo.</p></div>
    ${canEd("treinamentos") ? `<button class="btn primary" data-act="new-tr">${ICON.plus}Novo treinamento</button>` : ""}</div>
    ${trs.length ? `<div class="tabs" role="group" aria-label="Filtrar por área">${tabs}</div>` : ""}${body}`;
}

/* ---------- Funcionários ---------- */
const grupos = (e) => (e.cipa || e.brigada) ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${e.cipa ? `<span class="badge acc">CIPA</span>` : ""}${e.brigada ? `<span class="badge warn">Brigada</span>` : ""}</div>` : "";
function viewFuncionarios() {
  const emps = [...state.employees].sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
  if (!emps.length) return `<div class="head"><div><h1>Funcionários</h1><p>Cadastre quem vai realizar os treinamentos.</p></div></div>
    <div class="empty"><h3>Nenhum funcionário cadastrado</h3><p>Cada funcionário recebe os treinamentos da sua área e os de integração.</p>${canEd("funcionarios") ? `<button class="btn primary" data-act="new-emp">${ICON.plus}Cadastrar funcionário</button>` : ""}</div>`;
  const nC = emps.filter(e => e.cipa).length, nB = emps.filter(e => e.brigada).length;
  const ef = ui.empFilter || "all";
  const shown = ef === "cipa" ? emps.filter(e => e.cipa) : ef === "brigada" ? emps.filter(e => e.brigada) : emps;
  const ftabs = (nC || nB) ? `<div class="tabs" role="group" aria-label="Filtrar funcionários">
    <button class="tab" data-empf="all" aria-pressed="${ef === "all"}">Todos <span class="n">${emps.length}</span></button>
    <button class="tab" data-empf="cipa" aria-pressed="${ef === "cipa"}">CIPA <span class="n">${nC}</span></button>
    <button class="tab" data-empf="brigada" aria-pressed="${ef === "brigada"}">Brigada <span class="n">${nB}</span></button></div>` : "";
  const rows = shown.map(e => {
    const s = empStats(e);
    return `<tr><td><b>${esc(e.nome)}</b><div class="small muted">${esc(e.email || "")}</div>${grupos(e)}</td>
      <td>${esc(e.matricula || "—")}</td><td>${esc(e.cargo || "—")}</td><td>${areaChip(areaById(e.areaId))}</td><td>${fmtDate(e.admissao)}</td>
      <td><div class="prog"><div class="bar"><i style="width:${pct(s.done, s.total)}%"></i></div><span class="small">${s.done}/${s.total}</span></div>${(() => { const n = overdueOf(e); return n ? `<span class="badge bad" style="margin-top:6px">${n} atrasado${n > 1 ? "s" : ""}</span>` : ""; })()}</td>
      <td style="white-space:nowrap"><button class="btn ghost" data-act="view-emp" data-id="${esc(e.id)}" aria-label="Ver progresso de ${esc(e.nome)}">${ICON.eye}</button>
      ${canEd("funcionarios") ? `<button class="btn ghost" data-act="edit-emp" data-id="${esc(e.id)}" aria-label="Editar ${esc(e.nome)}">${ICON.edit}</button><button class="btn ghost danger" data-act="del-emp" data-id="${esc(e.id)}" aria-label="Excluir ${esc(e.nome)}">${ICON.trash}</button>` : ""}</td></tr>`;
  }).join("");
  return `<div class="head"><div><h1>Funcionários</h1><p>${emps.length} cadastrado${emps.length > 1 ? "s" : ""}. Cada um recebe os treinamentos da sua área e os de integração.</p></div>
    ${canEd("funcionarios") ? `<button class="btn primary" data-act="new-emp">${ICON.plus}Novo funcionário</button>` : ""}</div>
    ${ftabs}<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Área</th><th>Admissão</th><th>Progresso</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Áreas ---------- */
function viewAreas() {
  const areas = sortedAreas();
  const rows = areas.map(a => {
    const nt = state.trainings.filter(t => trInArea(t, a.id)).length, ne = state.employees.filter(e => e.areaId === a.id).length;
    return `<div class="list-row"><span class="dot" style="background:${esc(a.cor)};width:14px;height:14px"></span><div class="grow"><b>${esc(a.nome)}</b><div class="small muted">${nt} treinamento${nt === 1 ? "" : "s"} · ${ne} funcionário${ne === 1 ? "" : "s"}</div></div>
      ${canEd("areas") ? `<button class="btn ghost" data-act="edit-area" data-id="${esc(a.id)}">${ICON.edit}Editar</button><button class="btn ghost danger" data-act="del-area" data-id="${esc(a.id)}">${ICON.trash}</button>` : ""}</div>`;
  }).join("");
  return `<div class="head"><div><h1>Áreas</h1><p>Separe os treinamentos e funcionários por setor da empresa.</p></div>
    ${canEd("areas") ? `<button class="btn primary" data-act="new-area">${ICON.plus}Nova área</button>` : ""}</div>
    ${areas.length ? `<div class="panel"><div class="list">${rows}</div></div>` : `<div class="empty"><h3>Nenhuma área cadastrada</h3><p>Crie áreas como Produção, Comercial ou RH para organizar os treinamentos.</p>${canEd("areas") ? `<button class="btn primary" data-act="new-area">${ICON.plus}Criar área</button>` : ""}</div>`}`;
}


/* ---------- Sem acesso ---------- */
function viewSemAcesso() {
  return `<div class="head"><div><h1>Olá, ${esc(me.nome)}</h1></div></div><div class="empty"><h3>Seu perfil ainda não tem telas liberadas</h3><p>Peça ao administrador para ajustar a matriz de acesso do perfil ${esc(profLabel(me.perfil))}.</p></div>`;
}

/* ---------- Usuários e acessos ---------- */
function viewAcessos() {
  const users = [...state.users].sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
  const rows = users.map(u => {
    const emp = state.employees.find(e => e.id === u.employeeId);
    return `<tr><td><b>${esc(u.nome)}</b>${u.id === me.id ? ` <span class="small muted">(você)</span>` : ""}<div class="small muted">${esc(u.login)}</div></td>
      <td>${profBadge(u.perfil)}</td><td>${emp ? esc(emp.nome) : `<span class="muted">—</span>`}</td>
      <td>${u.ativo === false ? `<span class="badge bad">Inativo</span>` : `<span class="badge ok">Ativo</span>`}</td>
      <td style="white-space:nowrap;text-align:right">${caps.canWrite ? `<button class="btn ghost" data-act="edit-user" data-id="${esc(u.id)}" aria-label="Editar ${esc(u.nome)}">${ICON.edit}</button>${u.id !== me.id ? `<button class="btn ghost danger" data-act="del-user" data-id="${esc(u.id)}" aria-label="Excluir ${esc(u.nome)}">${ICON.trash}</button>` : ""}` : ""}</td></tr>`;
  }).join("");
  const m = matrix();
  let lastG = "";
  const mrows = PERMS.map(p => {
    const g = p.g !== lastG ? `<tr class="grp"><td colspan="4">${esc(p.g)}</td></tr>` : ""; lastG = p.g;
    const cell = (prof) => {
      if (prof === "admin") return `<input type="checkbox" checked disabled aria-label="${esc(p.l)}: Administrador">`;
      const on = !p.adminOnly && !!m[prof][p.k];
      return `<input type="checkbox" data-perm="${esc(p.k)}" data-prof="${prof}" ${on ? "checked" : ""} ${p.adminOnly || !caps.canWrite ? "disabled" : ""} aria-label="${esc(p.l)}: ${esc(profLabel(prof))}">`;
    };
    return g + `<tr><td>${esc(p.l)}${p.adminOnly ? `<div class="hint">Exclusivo do administrador</div>` : ""}</td><td>${cell("admin")}</td><td>${cell("master")}</td><td>${cell("usuario")}</td></tr>`;
  }).join("");
  return `<div class="head"><div><h1>Usuários e acessos</h1><p>Quem pode entrar no sistema e o que cada perfil pode fazer.</p></div>
    ${caps.canWrite ? `<button class="btn primary" data-act="new-user">${ICON.plus}Novo usuário</button>` : ""}</div>
    <div class="table-wrap" style="margin-bottom:28px"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Funcionário vinculado</th><th>Situação</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <h2>Matriz de acesso</h2>
    <p class="muted small" style="margin:-4px 0 14px;max-width:70ch">O Administrador tem acesso total e não pode ser restringido. As alterações valem imediatamente para Master e Usuário. Quem não pode escolher qualquer funcionário faz apenas os treinamentos do funcionário vinculado ao seu usuário.</p>
    <div class="table-wrap"><table class="matrix"><thead><tr><th>Permissão</th><th>Administrador</th><th>Master</th><th>Usuário</th></tr></thead><tbody>${mrows}</tbody></table></div>`;
}

function formUser(u) {
  const empOpts = `<option value="">Nenhum</option>` + [...state.employees].sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR")).map(e => `<option value="${esc(e.id)}" ${e.id === u?.employeeId ? "selected" : ""}>${esc(e.nome)}${e.matricula ? ` (${esc(e.matricula)})` : ""}</option>`).join("");
  openModal(u ? "Editar usuário" : "Novo usuário", `
    <div class="field"><label for="uNome">Nome completo</label><input type="text" id="uNome" value="${esc(u?.nome || "")}" required></div>
    <div class="row2"><div class="field"><label for="uLogin">Usuário (login)</label><input type="text" id="uLogin" value="${esc(u?.login || "")}" autocapitalize="none" spellcheck="false" autocomplete="off" required></div>
    <div class="field"><label for="uPerfil">Perfil</label><select id="uPerfil">${PROFILES.map(p => `<option value="${p.k}" ${(u?.perfil || "usuario") === p.k ? "selected" : ""}>${esc(p.l)}</option>`).join("")}</select></div></div>
    <div class="field"><label for="uEmp">Funcionário vinculado</label><select id="uEmp">${empOpts}</select><span class="hint">Necessário para quem faz apenas os próprios treinamentos.</span></div>
    <div class="row2"><div class="field"><label for="uSenha">${u ? "Nova senha" : "Senha"}</label><input type="password" id="uSenha" autocomplete="new-password"></div>
    <div class="field"><label for="uSenha2">Confirmar senha</label><input type="password" id="uSenha2" autocomplete="new-password"></div></div>
    <span class="hint" style="margin-top:-8px">${u ? "Deixe em branco para manter a senha atual. " : ""}Mínimo de 6 caracteres.</span>
    <label class="switch"><input type="checkbox" id="uAtivo" ${u?.ativo === false ? "" : "checked"}><span><b>Usuário ativo</b><span class="hint">Usuários inativos não conseguem entrar.</span></span></label>`,
    async () => {
      const nome = $("#uNome").value.trim(), login = $("#uLogin").value.trim().toLowerCase(), perfil = $("#uPerfil").value, ativo = $("#uAtivo").checked;
      const senha = $("#uSenha").value, senha2 = $("#uSenha2").value;
      if (!nome) { toast("Informe o nome."); return false; }
      if (!/^[a-z0-9._-]{3,}$/.test(login)) { toast("Login com ao menos 3 caracteres: letras, números, ponto, hífen ou sublinhado."); return false; }
      if (state.users.some(x => x.login === login && x.id !== u?.id)) { toast("Esse login já está em uso."); return false; }
      if (!u || senha) {
        if (senha.length < 6) { toast("A senha precisa ter pelo menos 6 caracteres."); return false; }
        if (senha !== senha2) { toast("As senhas não conferem."); return false; }
      }
      if (u) {
        const otherAdmins = state.users.filter(x => x.id !== u.id && x.perfil === "admin" && x.ativo !== false).length;

async function saveProgress(emp, t, patch, opts) {
  const id = `${emp.id}__${t.id}`;
  const cur = progOf(emp.id, t.id) || { employeeId: emp.id, trainingId: t.id, assistido: false, nota: null, aprovado: null, tentativas: 0 };
  const next = { ...cur, ...patch, atualizadoEm: new Date().toISOString() };
  delete next.id;
  if (isDone(next, t) && !next.concluidoEm) next.concluidoEm = new Date().toISOString();
  await Store.save("progress", id, next, opts);
}

/* ---------- player sem avanço ---------- */
let activePlayer = null;
function closePlayer(wrap) {
  const ap = activePlayer;
  if (ap && ap.wrap === wrap) { activePlayer = null; const snap = ap.snap(); setTimeout(() => ap.persist(snap), 0); }
  const v = $("video", wrap); if (v) { try { v.pause(); v.removeAttribute("src"); v.load(); } catch {} }
}
const flushPlayer = () => { if (activePlayer) activePlayer.persist(activePlayer.snap()); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPlayer(); });
window.addEventListener("pagehide", flushPlayer);

function initPlayer() {
  const wrap = $("#playerWrap");
  if (!wrap) { if (currentVideoUrl) { URL.revokeObjectURL(currentVideoUrl); currentVideoUrl = null; } return; }
  if (wrap.dataset.init) return;
  wrap.dataset.init = "1";
  const emp = state.employees.find(e => e.id === ui.studyEmp), t = state.trainings.find(x => x.id === ui.studyTraining);
  if (!emp || !t) return;
  const vid = $("video", wrap), q = (k) => $(`[data-p=${k}]`, wrap);
  const track = q("track"), seenEl = $(".seen", track), curEl = $(".cur", track), resume = $(".resume", wrap);
  const p0 = progOf(emp.id, t.id);
  let free = !!(p0 && p0.assistido);             // já assistido: pode navegar à vontade
  let maxSeen = free ? 0 : (+p0?.maxAssistido || 0);
  const startAt = free ? 0 : (+p0?.posicao || 0);
  let dur = 0, lastSave = { pos: startAt, max: maxSeen }, lastSaveAt = Date.now(), finishing = false;
  const SLACK = 1.5;

  const draw = () => {
    const c = vid.currentTime || 0, lim = free ? dur : Math.min(maxSeen, dur);
    seenEl.style.width = dur ? (lim / dur * 100) + "%" : "0";
    curEl.style.width = dur ? (c / dur * 100) + "%" : "0";
    q("time").textContent = `${fmtTime(c)} / ${fmtTime(dur)}`;
    const playing = !vid.paused && !vid.ended;
    q("play").innerHTML = playing ? ICON.pause : ICON.play;
    q("play").setAttribute("aria-label", playing ? "Pausar" : "Reproduzir");
    q("mute").innerHTML = vid.muted ? ICON.mute : ICON.vol;
    q("mute").setAttribute("aria-label", vid.muted ? "Ativar som" : "Desativar som");
  };
  const snap = () => ({ pos: vid.currentTime || 0, max: maxSeen, dur });
  const persist = (sn) => {
    if (free || !sn.dur) return;
    if (Math.abs(sn.pos - lastSave.pos) < 1 && Math.abs(sn.max - lastSave.max) < 1) return;
    lastSave = { pos: sn.pos, max: sn.max }; lastSaveAt = Date.now();
    const r = (x) => Math.round(x * 10) / 10;
    saveProgress(emp, t, { posicao: r(sn.pos), maxAssistido: r(sn.max), duracaoVideo: r(sn.dur) }, { silent: true }).catch(() => {});
  };
  activePlayer = { wrap, snap, persist };

  const play = () => { resume.hidden = true; const pr = vid.play(); if (pr) pr.catch(() => {}); };

  if (vid.dataset.local) {
    VideoDB.get(vid.dataset.local).then(blob => {
      if (!blob) { wrap.outerHTML = '<div class="player"><div class="novideo">O vídeo não foi encontrado neste navegador.</div></div>'; activePlayer = null; return; }
      if (currentVideoUrl) URL.revokeObjectURL(currentVideoUrl);
      currentVideoUrl = URL.createObjectURL(blob); vid.src = currentVideoUrl;
    }).catch(() => {});
  } else if (currentVideoUrl) { URL.revokeObjectURL(currentVideoUrl); currentVideoUrl = null; }

  vid.addEventListener("loadedmetadata", () => {
    dur = vid.duration || 0;
    if (!free) maxSeen = Math.min(maxSeen, dur);
    const s0 = Math.min(startAt, maxSeen);
    if (!free && s0 > 3 && s0 < dur - 1) {
      vid.currentTime = s0;
      $("[data-r=txt]", resume).textContent = `Você parou em ${fmtTime(s0)} de ${fmtTime(dur)}.`;
      resume.hidden = false;
    }
    draw();
  });
  vid.addEventListener("timeupdate", () => {
    const c = vid.currentTime;
    if (!free) {
      if (c > maxSeen + SLACK) { vid.currentTime = maxSeen; return; }
      if (!vid.seeking && c > maxSeen) maxSeen = c;
      if (!vid.paused && Date.now() - lastSaveAt > 10000) persist(snap());
    }
    draw();
  });
  vid.addEventListener("seeking", () => { if (!free && vid.currentTime > maxSeen + SLACK) vid.currentTime = maxSeen; });
  vid.addEventListener("ratechange", () => { if (!free && vid.playbackRate !== 1) vid.playbackRate = 1; });
  vid.addEventListener("play", draw);
  vid.addEventListener("pause", () => { draw(); persist(snap()); });
  vid.addEventListener("volumechange", draw);
  vid.addEventListener("ended", async () => {
    draw();
    if (free || finishing) return;
    if (maxSeen < dur - 2) { vid.currentTime = maxSeen; toast("Assista ao vídeo completo para concluir."); return; }
    finishing = true; free = true; maxSeen = dur; lastSave = { pos: 0, max: dur };
    try {
      await saveProgress(emp, t, { assistido: true, posicao: 0, maxAssistido: Math.round(dur * 10) / 10, duracaoVideo: Math.round(dur * 10) / 10 });
      toast(t.temTeste ? "Vídeo assistido. O teste foi liberado." : "Treinamento concluído.");
    } catch (e) { toast(e.message); free = false; finishing = false; }
  });

  vid.addEventListener("click", () => { if (vid.paused) play(); else vid.pause(); });
  q("play").onclick = () => { if (vid.paused) play(); else vid.pause(); };
  q("restart").onclick = () => { vid.currentTime = 0; play(); };
  q("mute").onclick = () => { vid.muted = !vid.muted; };
  const fsOk = !!(wrap.requestFullscreen && document.fullscreenEnabled);
  if (!fsOk) q("full").hidden = true;
  q("full").onclick = () => { if (document.fullscreenElement === wrap) document.exitFullscreen().catch(() => {}); else wrap.requestFullscreen().catch(() => {}); };
  track.addEventListener("click", (e) => {
    if (!dur) return;
    const r = track.getBoundingClientRect();
    let to = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * dur;
    if (!free && to > maxSeen) { to = maxSeen; toast("Só é possível voltar para trechos já assistidos."); }
    vid.currentTime = to; draw();
  });
  $("[data-r=cont]", resume).onclick = play;
  $("[data-r=ini]", resume).onclick = () => { vid.currentTime = 0; play(); };
  wrap.addEventListener("keydown", (e) => {
    if (e.target.closest("button")) return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); if (vid.paused) play(); else vid.pause(); }
    if (e.key === "ArrowRight" || e.key === "End") e.preventDefault();
  });
  draw();
}

  };
  $("#tTodas").onchange = syncArea; $$("input[name=tArea]").forEach(x => x.onchange = syncArea); $("#tCipa").onchange = syncArea; $("#tBrig").onchange = syncArea; syncArea();
  let pDias = t?.prazoDias || "30", pData = t?.prazoData || "";

  $("#tPrazoTipo").onchange = syncPrazo; syncPrazo();

  function drawTest() {

    box.innerHTML = `<div class="row2"><div class="field"><label for="tNota">Nota mínima para aprovação (%)</label><input type="number" id="tNota" min="0" max="100" value="${esc(nota)}"></div><div></div></div>
      ${perguntas.map((q, i) => `<div class="q" data-q="${i}">
        <div class="q-head"><span class="num">${i + 1}.</span><input type="text" data-f="texto" value="${esc(q.texto)}" placeholder="Enunciado da pergunta">${perguntas.length > 1 ? `<button type="button" class="btn ghost danger" data-rmq aria-label="Remover pergunta ${i + 1}">${ICON.trash}</button>` : ""}</div>
        ${q.opcoes.map((o, j) => `<div class="opt"><input type="radio" name="corr${i}" data-corr="${j}" ${q.correta === j ? "checked" : ""} aria-label="Alternativa ${j + 1} é a correta"><input type="text" data-opt="${j}" value="${esc(o)}" placeholder="Alternativa ${j + 1}">${q.opcoes.length > 2 ? `<button type="button" class="btn ghost" data-rmo="${j}" aria-label="Remover alternativa">${ICON.x}</button>` : ""}</div>`).join("")}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="hint">Marque a bolinha da alternativa correta.</span>${q.opcoes.length < 5 ? `<button type="button" class="btn ghost" data-addo>${ICON.plus}Alternativa</button>` : ""}</div>
      </div>`).join("")}
      <button type="button" class="btn" id="addQ" style="align-self:flex-start">${ICON.plus}Adicionar pergunta</button>`;
    $$(".q", box).forEach(el => {
      const i = +el.dataset.q, q = perguntas[i];

      $$("[data-corr]", el).forEach(r => r.onchange = () => q.correta = +r.dataset.corr);
      $$("[data-rmo]", el).forEach(b => b.onclick = () => { const j = +b.dataset.rmo; q.opcoes.splice(j, 1); if (q.correta === j) q.correta = 0; else if (q.correta > j) q.correta--; drawTest(); });

      const rq = $("[data-rmq]", el); if (rq) rq.onclick = () => { perguntas.splice(i, 1); drawTest(); };
    });
    $("#addQ").onclick = () => { perguntas.push({ texto: "", opcoes: ["", "", ""], correta: 0 }); drawTest(); $$(".q", box).at(-1).querySelector("input").focus(); };
  }
  $("#tTeste").onchange = drawTest; drawTest();
  $("#tTit").focus();

/* ---------- eventos da view ---------- */
const NEED = {
  "new-tr": "treinamentos.editar", "edit-tr": "treinamentos.editar", "del-tr": "treinamentos.editar",
  "new-emp": "funcionarios.editar", "edit-emp": "funcionarios.editar", "del-emp": "funcionarios.editar", "view-emp": "funcionarios.ver",
  "new-area": "areas.editar", "edit-area": "areas.editar", "del-area": "areas.editar",
  "export": "backup", "new-user": "usuarios", "edit-user": "usuarios", "del-user": "usuarios", "logo-rm": "config",
  "open-aula": "estudar"
};
function bindView() {
  const v = $("#view");
  v.onchange = async (ev) => {
    const cb = ev.target.closest("[data-perm]"); if (!cb) return;
    if (!can("usuarios")) return;
    const m = matrix(), prof = cb.dataset.prof, k = cb.dataset.perm, on = cb.checked;
    m[prof][k] = on ? 1 : 0;
    if (on && k.endsWith(".editar")) m[prof][k.replace(".editar", ".ver")] = 1;
    if (!on && k.endsWith(".ver")) m[prof][k.replace(".ver", ".editar")] = 0;
    if (on && k === "estudar.todos") m[prof].estudar = 1;
    if (!on && k === "estudar") m[prof]["estudar.todos"] = 0;
    try { await saveConfig({ matriz: m }); toast(`Acesso do perfil ${profLabel(prof)} atualizado.`); }
    catch (e) { cb.checked = !on; toast(e.message); }
  };
  const lf = $("#logoFile");
  if (lf) lf.onchange = async () => {
    const f = lf.files[0]; if (!f) return;
    try { const data = await readLogo(f); await saveConfig({ logo: data }); toast("Logo atualizada."); }
    catch (e) { toast(e.message || "Não foi possível usar esta imagem."); }
  };
  bindCertificados();
  const cf = $("#cfgForm");
  if (cf) cf.onsubmit = async (ev) => {
    ev.preventDefault();
    if (!can("config")) return;
    try { await saveConfig({ nome: $("#cNome").value.trim(), subtitulo: $("#cSub").value.trim(), titular: $("#cTit").value.trim(), cidade: $("#cCid").value.trim(), ass1Nome: $("#cA1").value.trim(), ass1Cargo: $("#cA1c").value.trim(), ass2Nome: $("#cA2").value.trim(), ass2Cargo: $("#cA2c").value.trim() }); toast("Configurações salvas."); }
    catch (e) { toast(e.message); }
  };
  v.onclick = async (ev) => {
    const ft = ev.target.closest("[data-empf]");
    if (ft) { ui.empFilter = ft.dataset.empf; render(); return; }
    const tab = ev.target.closest("[data-filter]");
    if (tab) { ui.areaFilter = tab.dataset.filter; render(); return; }
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    const need = NEED[act]; if (need && !can(need)) { toast("Seu perfil não permite esta ação."); return; }
    try {
      if (act === "new-tr") formTraining(null);
      else if (act === "edit-tr") formTraining(state.trainings.find(x => x.id === id));
      else if (act === "del-tr") {
        const t = state.trainings.find(x => x.id === id);
        if (await askConfirm("Excluir treinamento?", `“${t.titulo}” e o histórico de quem o realizou serão apagados.`)) {
          await Promise.all(state.progress.filter(p => p.trainingId === id).map(p => Store.remove("progress", p.id)));
          if (t.videoId) Store.deleteVideo(t.videoId);
          await Store.remove("trainings", id); toast("Treinamento excluído.");
        }
      }
      else if (act === "export") {
        const blob = new Blob([JSON.stringify({ versao: 1, exportadoEm: new Date().toISOString(), ...state }, null, 2)], { type: "application/json" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `treinamentos-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup exportado (os vídeos não entram no arquivo).");
      }
      else if (act === "new-emp") formEmp(null);
      else if (act === "edit-emp") formEmp(state.employees.find(x => x.id === id));
      else if (act === "view-emp") viewEmpModal(state.employees.find(x => x.id === id));
      else if (act === "del-emp") {
        const e = state.employees.find(x => x.id === id);
        if (await askConfirm("Excluir funcionário?", `${e.nome} e o histórico de treinamentos serão apagados.`)) {
          await Promise.all(state.progress.filter(p => p.employeeId === id).map(p => Store.remove("progress", p.id)));
          await Store.remove("employees", id); toast("Funcionário excluído.");
        }
      }
      else if (act === "new-user") formUser(null);
      else if (act === "edit-user") formUser(state.users.find(x => x.id === id));
      else if (act === "del-user") {
        const u = state.users.find(x => x.id === id);
        if (!u || u.id === me.id) return;
        if (u.perfil === "admin" && u.ativo !== false && !state.users.some(x => x.id !== u.id && x.perfil === "admin" && x.ativo !== false)) { toast("É preciso manter pelo menos um administrador ativo."); return; }
        if (await askConfirm("Excluir usuário?", `${u.nome} (${u.login}) perderá o acesso ao sistema. O cadastro de funcionário e o histórico de treinamentos não são apagados.`)) { await Store.remove("users", id); toast("Usuário excluído."); }
      }
      else if (act === "logo-rm") {
        if (await askConfirm("Remover logo?", "O sistema volta a usar o ícone padrão.", "Remover")) { await saveConfig({ logo: "" }); toast("Logo removida."); }
      }
      else if (act === "new-area") formArea(null);
      else if (act === "edit-area") formArea(state.areas.find(x => x.id === id));
      else if (act === "del-area") {
        const a = state.areas.find(x => x.id === id);
        const inUse = state.trainings.some(t => trInArea(t, id)) || state.employees.some(e => e.areaId === id);
        if (inUse) { toast("Mova os treinamentos e funcionários desta área antes de excluí-la."); return; }
        if (await askConfirm("Excluir área?", `A área “${a.nome}” será removida.`)) { await Store.remove("areas", id); toast("Área excluída."); }
      }
      else if (act === "open-aula") { ui.studyTraining = id; ui.quizResult = null; ui.forceQuiz = false; render(); window.scrollTo(0, 0); }
      else if (act === "back-track") { ui.studyTraining = null; ui.quizResult = null; ui.forceQuiz = false; render(); }
      else if (act === "retry") { ui.quizResult = null; ui.forceQuiz = true; render(); }
    } catch (err) { toast(err.message || "Algo deu errado."); }
  };
  const imp = $("#importFile");
  if (imp) imp.onchange = async () => {
    const f = imp.files[0]; if (!f) return;
    if (!can("backup")) return;
    try {
      const data = JSON.parse(await f.text());
      if (!DATA_COLS.every(c => Array.isArray(data[c]))) throw new Error();
      const comUsuarios = Array.isArray(data.users) && data.users.length;
      if (!(await askConfirm("Importar backup?", `Os dados atuais deste navegador serão substituídos pelos do arquivo.${comUsuarios ? " Os usuários e senhas do arquivo também serão importados." : ""}`, "Importar"))) return;
      DATA_COLS.forEach(c => state[c] = data[c]);
      if (comUsuarios) state.users = data.users;
      if (Array.isArray(data.config) && data.config.length) state.config = data.config;
      Store.persistLocal(); render(); toast("Backup importado.");
    } catch { toast("Arquivo de backup inválido."); }
  };
  const pickEl = $("#empPick");
  if (pickEl) pickEl.onchange = () => { ui.studyEmp = pickEl.value; ui.studyTraining = null; render(); };
  const stMes = $("#stMes"), stRef = $("#stRef"), stLimpar = $("#stLimpar");
  if (stMes) stMes.onchange = () => { ui.studyMes = stMes.value; render(); };
  if (stRef) stRef.onchange = () => { ui.studyRef = stRef.value; render(); };
  if (stLimpar) stLimpar.onclick = () => { ui.studyMes = ""; render(); };
  initPlayer();
  const qf = $("#quizForm");
  if (qf) qf.onsubmit = async (ev) => {
    ev.preventDefault();
    const emp = state.employees.find(e => e.id === ui.studyEmp), t = state.trainings.find(x => x.id === ui.studyTraining);
    const qs = t.perguntas || [];
    const respostas = qs.map((_, i) => { const c = qf.querySelector(`input[name=q${i}]:checked`); return c ? +c.value : null; });
    const falta = respostas.findIndex(r => r === null);
    if (falta >= 0) { toast(`Responda a pergunta ${falta + 1}.`); return; }
    const acertos = respostas.filter((r, i) => r === qs[i].correta).length;
    const nota = pct(acertos, qs.length), aprovado = nota >= (t.notaMinima ?? 70);
    const cur = progOf(emp.id, t.id);
    try {
      await saveProgress(emp, t, { nota, aprovado, tentativas: (cur?.tentativas || 0) + 1, assistido: true });
      ui.quizResult = { trainingId: t.id, respostas, acertos, nota, aprovado }; ui.forceQuiz = false;
      render(); window.scrollTo(0, document.body.scrollHeight);
    } catch (e) { toast(e.message); }
  };
}

Store.init();
})();
</script>
</body>
</html>
